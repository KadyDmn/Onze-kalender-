<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaarkalender 2027</title>
<style>
:root{color-scheme:dark;--bg:#09070f;--surface:#120d1b;--surface2:#171021;--line:#a83f88;--line2:#6f2f8c;--pink:#ff4fc3;--purple:#b86cff;--text:#f8edf8;--muted:#bcaec0;--shadow:0 0 24px rgba(255,79,195,.13)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
#app{min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(184,108,255,.12),transparent 32%),radial-gradient(circle at 88% 18%,rgba(255,79,195,.09),transparent 30%),var(--bg);padding:28px}
.top{max-width:1450px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap}.title h1{margin:0;font-size:30px;letter-spacing:-.5px}.title p{margin:5px 0 0;color:var(--muted)}
.people{display:flex;gap:7px;flex-wrap:wrap}.person{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #63305f;border-radius:999px;background:rgba(20,13,29,.82);box-shadow:0 0 14px rgba(255,79,195,.08);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
.layout{max-width:1450px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px}.calendar{border:1px solid var(--line);border-radius:18px;background:rgba(13,9,20,.92);box-shadow:var(--shadow);padding:14px}.year{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.month{border:1px solid #532852;border-radius:13px;background:linear-gradient(145deg,rgba(25,16,34,.96),rgba(14,10,22,.96));padding:10px;box-shadow:inset 0 0 20px rgba(184,108,255,.025)}.month h2{text-align:center;font-size:15px;margin:0 0 8px;color:#ffd9f4}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.dow span{text-align:center;font-size:9px;color:#9f8fa3;padding-bottom:3px}.day{min-height:45px;border:1px solid #35213b;border-radius:7px;background:#100b17;color:var(--text);padding:4px;text-align:left;cursor:pointer;transition:.15s}.day:hover{border-color:#c34ba6;box-shadow:0 0 9px rgba(255,79,195,.17);transform:translateY(-1px)}.num{font-size:10px;font-weight:700;color:#ead5e8}.marks{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}.mark{width:7px;height:7px;border-radius:50%;box-shadow:0 0 6px currentColor}.side{border:1px solid var(--line);border-radius:18px;background:rgba(16,10,24,.95);box-shadow:var(--shadow);padding:16px;align-self:start}.side h2{margin:0 0 12px;font-size:17px;color:#ffd9f4}.status{display:grid;gap:8px}.status button,.save,.send{border:1px solid #68345f;border-radius:9px;background:#171020;color:var(--text);padding:10px;cursor:pointer;text-align:left}.status button:hover,.save:hover,.send:hover{border-color:var(--pink);box-shadow:0 0 12px rgba(255,79,195,.13)}.selected,.messages{margin-top:16px;padding-top:14px;border-top:1px solid #3b2540}.selected strong,.messages h3{display:block;margin-bottom:8px}.row{display:flex;gap:6px;margin-bottom:8px}.row input,.row select,.msginput{width:100%;min-width:0;border:1px solid #593052;border-radius:8px;background:#0d0913;color:var(--text);padding:9px;outline:none}.row input:focus,.row select:focus,.msginput:focus{border-color:var(--pink);box-shadow:0 0 9px rgba(255,79,195,.12)}.hint{font-size:11px;color:var(--muted);line-height:1.4;margin-top:8px}.message{background:#140e1c;border:1px solid #3d2542;border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px}.msgform{display:flex;gap:6px}.send{font-size:12px;white-space:nowrap}.glow{height:1px;margin:0 auto 18px;max-width:1450px;background:linear-gradient(90deg,transparent,var(--pink),var(--purple),transparent);opacity:.7;box-shadow:0 0 12px var(--pink)}
@media(max-width:1050px){.year{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){#app{padding:16px}.layout{grid-template-columns:1fr}.year{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.year{grid-template-columns:1fr}.title h1{font-size:24px}.day{min-height:50px}}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="title"><h1>Jaarkalender 2027</h1><p>Klik op een datum om te laten weten of je kunt.</p></div><div class="people" id="people"></div></div>
<div class="glow"></div>
<div class="layout"><main class="calendar"><div class="year" id="year"></div></main>
<aside class="side"><h2 id="selTitle">Kies een datum</h2><div class="status"><button data-status="kan">🔵 Ik kan</button><button data-status="misschien">🩷 Misschien</button><button data-status="niet">🟢 Ik kan niet</button></div>
<div class="selected"><strong>Mijn naam</strong><div class="row"><input id="name" placeholder="Je naam"></div><button class="save" id="save">Opslaan</button><button class="save" id="removeMark">🗑 Mijn markering verwijderen</button><div class="hint">De kleur van het bolletje laat zien wat je hebt gekozen: blauw = ik kan, roze = misschien, groen = ik kan niet.</div></div>
<div class="messages"><h3>Berichten</h3><div id="messages"></div><div class="msgform"><input class="msginput" id="msg" placeholder="Typ een bericht…"><button class="send" id="send">Stuur</button></div></div></aside></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jvrizbafcgscobggapxy.supabase.co';
const SUPABASE_KEY='sb_publishable_5WiBZllCJqswUsyDBDdhkg_dNov8AOp';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const months=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'],days=['ma','di','wo','do','vr','za','zo'];const statusColors={kan:'#69a8ff',misschien:'#ff66c4',niet:'#62e58a'};let selected=null,person={name:''},choices={},messages=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(m,d){return `2027-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function render(){const y=document.getElementById('year');y.innerHTML='';months.forEach((month,m)=>{const box=document.createElement('section');box.className='month';box.innerHTML=`<h2>${month}</h2><div class="dow">${days.map(d=>`<span>${d}</span>`).join('')}</div><div class="days"></div>`;const grid=box.querySelector('.days');const start=(new Date(Date.UTC(2027,m,1)).getUTCDay()+6)%7;for(let i=0;i<start;i++)grid.appendChild(document.createElement('div'));const total=new Date(Date.UTC(2027,m+1,0)).getUTCDate();for(let d=1;d<=total;d++){const k=key(m,d),b=document.createElement('button');b.className='day';b.dataset.key=k;b.innerHTML=`<div class="num">${d}</div><div class="marks">${(choices[k]||[]).map(x=>`<span class="mark" style="background:${statusColors[x.status]};color:${statusColors[x.status]}" title="${esc(x.name)}: ${x.status}"></span>`).join('')}</div>`;b.onclick=()=>{selected=k;document.getElementById('selTitle').textContent=`${d} ${month} 2027`;document.querySelectorAll('.day').forEach(e=>e.style.boxShadow=e===b?'inset 0 0 0 2px #ff4fc3':'')};grid.appendChild(b)}y.appendChild(box)});renderPeople();renderMessages()}
function renderPeople(){const p=document.getElementById('people');const all=Object.values(choices).flat().filter((x,i,a)=>a.findIndex(y=>y.name===x.name)===i);p.innerHTML=all.map(x=>`<span class="person"><i class="dot" style="background:${statusColors[x.status]};color:${statusColors[x.status]}" title="${esc(x.status)}"></i>${esc(x.name)}</span>`).join('')}
function renderMessages(){document.getElementById('messages').innerHTML=messages.slice(-8).map((x,i)=>`<div class="message"><b>${esc(x.name)}</b>: ${esc(x.text)}${x.name===person.name?` <button onclick="removeMessage(${messages.indexOf(x)})" style="float:right;border:0;background:none;color:#ff66c4;cursor:pointer">✕</button>`:''}</div>`).join('')}
function removeMessage(i){if(messages[i]&&messages[i].name===person.name){messages.splice(i,1);renderMessages()}}
async function loadShared(){const [{data:marks,error:me},{data:msgs,error:ms}]=await Promise.all([db.from('marks').select('*'),db.from('messages').select('*').order('created_at',{ascending:true})]);if(me)console.error(me);if(ms)console.error(ms);choices={};(marks||[]).forEach(x=>{(choices[x.date_key]??=[]).push({name:x.name,status:x.status})});messages=(msgs||[]).map(x=>({id:x.id,name:x.name,text:x.text}));render()}
async function saveMark(status){if(!selected){document.getElementById('selTitle').textContent='Kies eerst een datum';return}if(!person.name){document.getElementById('selTitle').textContent='Vul eerst je naam in';document.getElementById('name').focus();return}await db.from('marks').delete().eq('date_key',selected).eq('name',person.name);const {error}=await db.from('marks').insert({date_key:selected,name:person.name,status});if(error){document.getElementById('selTitle').textContent='Opslaan mislukt: '+(error.message||'onbekende fout');console.error(error);return}await loadShared()}
async function removeMark(){if(!selected){document.getElementById('selTitle').textContent='Kies eerst een datum';return}if(!person.name){document.getElementById('selTitle').textContent='Vul eerst je naam in';document.getElementById('name').focus();return}const {error}=await db.from('marks').delete().eq('date_key',selected).eq('name',person.name);if(error){document.getElementById('selTitle').textContent='Verwijderen mislukt';console.error(error);return}await loadShared()}
document.getElementById('save').onclick=()=>{person.name=document.getElementById('name').value.trim();renderPeople();renderMessages()};document.getElementById('removeMark').onclick=removeMark;document.querySelectorAll('[data-status]').forEach(btn=>btn.onclick=()=>saveMark(btn.dataset.status));document.getElementById('send').onclick=async()=>{const text=document.getElementById('msg').value.trim();if(!text||!person.name)return;const {error}=await db.from('messages').insert({name:person.name,text});if(error){console.error(error);return}document.getElementById('msg').value='';await loadShared()};loadShared();
</script>
</body>
</html>
